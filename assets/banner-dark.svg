<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Imrane Adli — Software Engineer">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2F5BEA"/><stop offset="1" stop-color="#22B8CF"/>
    </linearGradient>
    <style>
      .n{font:800 64px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#E6EDF3;letter-spacing:-1.5px}
      .t{font:500 24px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#8B98A5}
      .m{font:500 15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#8B98A5}
      .s{font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#E6EDF3}
    </style>
  </defs>
  <rect width="1200" height="300" rx="16" fill="#0D1117"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="none" stroke="#30363D"/>
  <text x="64" y="128" class="n">Imrane Adli</text>
  <text x="66" y="172" class="t">Software Engineer · Full Stack · Cloud · Applied AI</text>
  <!-- call trace motif -->
  <line x1="66" y1="232" x2="1134" y2="232" stroke="#30363D" stroke-width="2"/>
  <line x1="66" y1="232" x2="1134" y2="232" stroke="url(#g)" stroke-width="2" stroke-dasharray="1068" stroke-dashoffset="1068">
    <animate attributeName="stroke-dashoffset" from="1068" to="0" dur="2.4s" fill="freeze"/>
  </line>
  <g>
    <circle cx="66" cy="232" r="7" fill="#0D1117" stroke="#2F5BEA" stroke-width="2"/>
    <circle cx="333" cy="232" r="7" fill="#0D1117" stroke="#2F5BEA" stroke-width="2"/>
    <circle cx="600" cy="232" r="7" fill="#2EA043"/>
    <circle cx="867" cy="232" r="7" fill="#0D1117" stroke="#22B8CF" stroke-width="2"/>
    <circle cx="1134" cy="232" r="7" fill="#2EA043"/>
  </g>
  <text x="66" y="266" class="s">lead</text><text x="333" y="266" class="s" text-anchor="middle">call</text>
  <text x="600" y="266" class="s" text-anchor="middle">answered</text><text x="867" y="266" class="s" text-anchor="middle">transcribed</text>
  <text x="1134" y="266" class="s" text-anchor="end">analyzed</text>
  <text x="1134" y="60" class="m" text-anchor="end">Casablanca, Morocco</text>
</svg>
